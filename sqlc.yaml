version: "2"
sql:
  - engine: "postgresql"
    schema: "migrations"
    queries: "queries"
    gen:
      go:
        package: "postgres"
        out: "./internal/hub/store/postgres/gen"
        sql_package: "database/sql"
        emit_interface: true
        emit_pointers_for_null_types: true
    #        emit_json_tags: true
        overrides:
          - db_type: "text"
            nullable: true
            go_type:
              type: "string"
              pointer: true
          - db_type: "timestamptz"
            nullable: true
            go_type:
              import: "time"
              type: "Time"
              pointer: true
          - db_type: "pg_catalog.int4"
            nullable: true
            go_type:
              type: "int"
              pointer: true
          - db_type: "jsonb"
            nullable: true
            go_type:
              type: "byte"
              slice: true
          - db_type: "json"
            nullable: true
            go_type:
              type: "byte"
              slice: true